    <path class="fur" d="M30 26 C40 24 56 24 66 26 C72 26 74 32 73 42 C72 50 75 62 67 73 C61 80 57 82 48 82 C39 82 35 80 29 73 C21 62 24 50 23 42 C22 32 24 26 30 26 Z" />
    <path class="line" d="M30 26 C40 24 56 24 66 26 C72 26 74 32 73 42 C72 50 75 62 67 73 C61 80 57 82 48 82 C39 82 35 80 29 73 C21 62 24 50 23 42 C22 32 24 26 30 26 Z" />

