<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <clipPath id="capy-clip-1">
      <circle cx="48" cy="48" r="46" />
    </clipPath>
  </defs>

  <style>
    .bg { fill: #d8efe4; }
    .fur { fill: #b87c4c; }
    .shade { fill: #854e27; }
    .muzzle { fill: #9e6339; }
    .ink { fill: #231309; }
    .blush { fill: #e58b73; opacity: 0.55; }
    .accent { fill: #cfa075; }
    .accent2 { fill: #dcb38e; }
    .line { fill: none; stroke: #4e2710; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .star { fill: none; stroke: #f6b93b; stroke-width: 1.5; stroke-linecap: round; }
  </style>

  <!-- Background -->
  <circle class="bg" cx="48" cy="48" r="46" />

