<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <clipPath id="capy-clip-2">
      <circle cx="48" cy="48" r="46" />
    </clipPath>
  </defs>

  <style>
    .bg { fill: #eee6fa; }
    .fur { fill: #c49267; }
    .shade { fill: #8f5834; }
    .muzzle { fill: #ab724b; }
    .ink { fill: #2a1a12; }
    .blush { fill: #f39182; opacity: 0.6; }
    .accent { fill: #fca5b9; }
    .accent2 { fill: #ffe07a; }
    .line { fill: none; stroke: #54311c; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .star { fill: none; stroke: #cbb4ec; stroke-width: 1.5; stroke-linecap: round; }
  </style>

  <!-- Background -->
  <circle class="bg" cx="48" cy="48" r="46" />

  <g clip-path="url(#capy-clip-2)">
    <!-- Stars / Sparkles -->
    <path class="star" d="M77 15 L77 23 M73 19 L81 19" />
    <path class="star" d="M19 21 L19 27 M16 24 L22 24" />

    <!-- Body / Chest (matching fur color) -->
    <path class="fur" d="M10 96 L10 84 C17 81 23 74 26 66 L70 66 C73 74 79 81 86 84 L86 96 Z" />

    <!-- Subtle shadow cast under chin -->
    <path class="shade" d="M36 80 C42 85 54 85 60 80 C55 87 41 87 36 80 Z" />

    <!-- Shoulder Outlines (exact match to body curve) -->
    <path class="line" d="M10 84 C17 81 23 74 26 66" />
    <path class="line" d="M70 66 C73 74 79 81 86 84" />

    <!-- Ears -->
    <g>
      <!-- Left ear -->
      <path class="fur" d="M26 35 C19 33 20 23 28 24 C30 24 32 27 31 34" />
      <path class="shade" d="M26 32 C23 30 23 26 27 26 C28.5 26 29.5 28 29.5 32 Z" />
      <path class="line" d="M26 35 C19 33 20 23 28 24 C30 24 32 27 31 34" />

      <!-- Right ear -->
      <path class="fur" d="M70 35 C77 33 76 23 68 24 C66 24 64 27 65 34" />
      <path class="shade" d="M70 32 C73 30 73 26 69 26 C67.5 26 66.5 28 66.5 32 Z" />
      <path class="line" d="M70 35 C77 33 76 23 68 24 C66 24 64 27 65 34" />
    </g>

    <!-- Head -->
    <path class="fur" d="M31 26 C41 24.5 55 24.5 65 26 C71 26 73 32 72 42 C71 50 74 61 67 72 C61 79 57 81 48 81 C39 81 35 79 29 72 C22 61 25 50 24 42 C23 32 25 26 31 26 Z" />
    <path class="line" d="M31 26 C41 24.5 55 24.5 65 26 C71 26 73 32 72 42 C71 50 74 61 67 72 C61 79 57 81 48 81 C39 81 35 79 29 72 C22 61 25 50 24 42 C23 32 25 26 31 26 Z" />

    <!-- Snout / Muzzle -->
    <path class="muzzle" d="M36 49 C37 45 41 44 48 44 C55 44 59 45 60 49 C62 56 63 67 58 73 C54 77 42 77 38 73 C33 67 34 56 36 49 Z" />
    <path class="line" d="M36 49 C37 45 41 44 48 44 C55 44 59 45 60 49 C62 56 63 67 58 73 C54 77 42 77 38 73 C33 67 34 56 36 49 Z" />

    <!-- Blush Spots -->
    <ellipse class="blush" cx="27.5" cy="46" rx="4.8" ry="2.8" transform="rotate(-6 27.5 46)" />
    <ellipse class="blush" cx="68.5" cy="46" rx="4.8" ry="2.8" transform="rotate(6 68.5 46)" />

    <!-- Eyes with Eyelashes -->
    <!-- Left Eye -->
    <ellipse class="ink" cx="29" cy="37" rx="3.1" ry="2.3" transform="rotate(10 29 37)" />
    <circle cx="28.2" cy="36.2" r="0.8" fill="#ffffff" />
    <path class="line" d="M25 36.5 C27 33.5 31.5 34.5 33.5 37" />
    <path class="line" stroke-width="1.3" d="M24.8 35 L22.5 33" />
    <path class="line" stroke-width="1.3" d="M26.8 33.8 L25.5 31.5" />

    <!-- Right Eye -->
    <ellipse class="ink" cx="67" cy="37" rx="3.1" ry="2.3" transform="rotate(-10 67 37)" />
    <circle cx="66.2" cy="36.2" r="0.8" fill="#ffffff" />
    <path class="line" d="M62.5 37 C64.5 34.5 69 33.5 71 36.5" />
    <path class="line" stroke-width="1.3" d="M71.2 35 L73.5 33" />
    <path class="line" stroke-width="1.3" d="M69.2 33.8 L70.5 31.5" />

    <!-- Nostrils -->
    <path class="ink" d="M41.5 53.5 C39.5 52.5 40.5 49.5 43.5 49.5 C45.5 49.5 45.5 52.5 43.5 54.5 C42.5 55.5 41.5 54.5 41.5 53.5 Z" />
    <path class="ink" d="M54.5 53.5 C56.5 52.5 55.5 49.5 52.5 49.5 C50.5 49.5 50.5 52.5 52.5 54.5 C53.5 55.5 54.5 54.5 54.5 53.5 Z" />

    <!-- Philtrum & Curved Smile -->
    <path class="line" d="M48 53.5 L48 64.5" />
    <path class="line" d="M41.5 65.5 C45 68 51 68 54.5 65.5" />

    <!-- Whisker Dots -->
    <circle class="ink" cx="38.5" cy="59.5" r="0.85" />
    <circle class="ink" cx="37" cy="63.5" r="0.85" />
    <circle class="ink" cx="41" cy="63.5" r="0.85" />
    <circle class="ink" cx="57.5" cy="59.5" r="0.85" />
    <circle class="ink" cx="59" cy="63.5" r="0.85" />
    <circle class="ink" cx="55" cy="63.5" r="0.85" />

    <!-- Ear Flower Clip -->
    <g transform="translate(64, 25)">
      <circle class="accent" cx="0" cy="-3.2" r="2.2" />
      <circle class="accent" cx="3" cy="-1" r="2.2" />
      <circle class="accent" cx="2" cy="2.6" r="2.2" />
      <circle class="accent" cx="-2" cy="2.6" r="2.2" />
      <circle class="accent" cx="-3" cy="-1" r="2.2" />
      <circle class="accent2" cx="0" cy="0" r="1.8" />
      <circle class="line" cx="0" cy="0" r="1.8" stroke-width="0.9" />
    </g>
  </g>
