<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    .bg { fill: #CEDCDA; }
    .fur { fill: #885B37; }
    .shade { fill: #5E391D; }
    .muzzle { fill: #3F230F; }
    .ink { fill: #1A0D06; }
    .blush { fill: #966138; }
    .accent { fill: #E59B22; }
    .accent2 { fill: #5B7F77; }
    .line { fill: none; stroke: #1A0D06; stroke-width: 2.5; stroke-linecap: round; }
    .star { fill: none; stroke: #E59B22; stroke-width: 4; }
  </style>

  <circle cx="100" cy="100" r="96" class="bg" />

  <!-- Neck Submerged in Hot Spring -->
  <path d="M 44 200 C 44 148 64 135 100 135 C 136 135 156 148 156 200 Z" class="shade" />
  <path d="M 52 200 C 52 154 70 142 100 142 C 130 142 148 154 148 200 Z" class="fur" />

  <!-- Tiny Relaxed Ears -->
  <ellipse cx="58" cy="76" rx="7" ry="5" transform="rotate(-30 58 76)" class="shade" />
  <ellipse cx="142" cy="76" rx="7" ry="5" transform="rotate(30 142 76)" class="shade" />

  <!-- Boxy Head with Flat Top -->
  <path d="M 66 76 C 70 66 130 66 134 76 C 138 92 142 116 136 136 C 130 148 70 148 64 136 C 58 116 62 92 66 76 Z" class="fur" />

  <!-- Heavy Snout Pad -->
  <path d="M 76 104 C 82 100 118 100 124 104 C 128 110 128 126 124 136 C 118 144 82 144 76 136 C 72 126 72 110 76 104 Z" class="muzzle" />

  <!-- Nostril Slits -->
  <ellipse cx="88" cy="114" rx="3.5" ry="2" transform="rotate(20 88 114)" class="ink" />
  <ellipse cx="112" cy="114" rx="3.5" ry="2" transform="rotate(-20 112 114)" class="ink" />
  <path d="M 100 116 L 100 127" class="line" stroke-width="2" />
  <path d="M 88 128 C 94 130 106 130 112 128" class="line" stroke-width="2" />

  <!-- Half-Closed Drooping Slit Eyes (Total Relaxation) -->
  <path d="M 64 86 L 73 87" class="line" stroke-width="2.5" />
  <path d="M 136 86 L 127 87" class="line" stroke-width="2.5" />

  <!-- Natural Yuzu Fruit on Flat Head -->
  <circle cx="100" cy="56" r="13" class="accent" />
  <circle cx="100" cy="45" r="1.5" class="shade" />
  <path d="M 100 45 Q 105 40 110 43" stroke="#4B6940" stroke-width="2" stroke-linecap="round" class="line" />

  <!-- Hot Spring Water Layer -->
  <path d="M 15 160 C 45 154 75 164 105 158 C 135 152 165 162 185 158 L 185 200 L 15 200 Z" class="accent2" opacity="0.8" />
  <path d="M 25 168 C 65 162 105 172 145 166" stroke="#CEDCDA" stroke-width="2" stroke-linecap="round" class="line" />
</svg>