<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Golden Hour — capybara profile picture</title>
<desc id="desc">Editable vector capybara with golden hour accessories. Color palette is in the style block.</desc>
