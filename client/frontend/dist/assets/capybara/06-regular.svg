<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    .bg { fill: #EAE3D2; }
    .fur { fill: #8D5B34; }
    .shade { fill: #663D1E; }
    .muzzle { fill: #3D2312; }
    .ink { fill: #1A0F08; }
    .blush { fill: #7A4B27; }
    .accent { fill: #A57045; }
    .accent2 { fill: #8C9A7A; }
    .line { fill: none; stroke: #1A0F08; stroke-width: 2.5; stroke-linecap: round; }
    .star { fill: none; stroke: #8C9A7A; stroke-width: 4; }
  </style>

  <circle cx="100" cy="100" r="96" class="bg" />

  <!-- Neck/Body spreading out wide -->
  <path d="M 40 200 C 40 145 60 135 100 135 C 140 135 160 145 160 200 Z" class="shade" />
  <path d="M 48 200 C 48 152 68 140 100 140 C 132 140 152 152 152 200 Z" class="fur" />

  <!-- Tiny Rounded Ears (Far Back, High Up) -->
  <ellipse cx="58" cy="68" rx="8" ry="6" transform="rotate(-25 58 68)" class="shade" />
  <ellipse cx="59" cy="68" rx="5" ry="3.5" transform="rotate(-25 59 68)" class="blush" />
  <ellipse cx="142" cy="68" rx="8" ry="6" transform="rotate(25 142 68)" class="shade" />
  <ellipse cx="141" cy="68" rx="5" ry="3.5" transform="rotate(25 141 68)" class="blush" />

  <!-- Blocky Skull Shape: Narrow crown widening to thick jowls -->
  <path d="M 68 70 C 72 58 128 58 132 70 C 136 84 144 110 138 132 C 132 148 68 148 62 132 C 56 110 64 84 68 70 Z" class="fur" />

  <!-- Bridge of Nose Shadow -->
  <path d="M 82 66 L 118 66 L 124 105 C 124 125 116 138 100 138 C 84 138 76 125 76 105 Z" class="shade" opacity="0.35" />

  <!-- Broad Blunt Snout Pad -->
  <path d="M 78 102 C 84 98 116 98 122 102 C 128 108 128 126 124 134 C 118 142 82 142 76 134 C 72 126 72 108 78 102 Z" class="muzzle" />

  <!-- Nostrils (Lateral slits angled outwards) -->
  <ellipse cx="88" cy="112" rx="4" ry="2.2" transform="rotate(25 88 112)" class="ink" />
  <ellipse cx="112" cy="112" rx="4" ry="2.2" transform="rotate(-25 112 112)" class="ink" />

  <!-- Realistic Philtrum / Split Lip -->
  <path d="M 100 114 L 100 125" class="line" stroke-width="2.2" />
  <path d="M 88 127 C 94 129 106 129 112 127" class="line" stroke-width="2.2" />

  <!-- Tiny Lateral Eyes (Set far apart, strictly neutral) -->
  <g>
    <ellipse cx="67" cy="80" rx="4.5" ry="3" transform="rotate(10 67 80)" class="ink" />
    <circle cx="68" cy="79.5" r="0.8" fill="#FFF" />
    <path d="M 63 76 C 66 75 70 76 72 78" class="line" stroke-width="1.5" />
  </g>
  <g>
    <ellipse cx="133" cy="80" rx="4.5" ry="3" transform="rotate(-10 133 80)" class="ink" />
    <circle cx="132" cy="79.5" r="0.8" fill="#FFF" />
    <path d="M 137 76 C 134 75 130 76 128 78" class="line" stroke-width="1.5" />
  </g>

  <!-- Cheek Highlights -->
  <path d="M 64 116 C 64 100 70 95 74 95 C 72 110 70 125 64 116 Z" class="accent" opacity="0.4" />
  <path d="M 136 116 C 136 100 130 95 126 95 C 128 110 130 125 136 116 Z" class="accent" opacity="0.4" />
</svg>