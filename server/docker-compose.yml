services:
  ircapybara:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "6697:6697/tcp"
    environment:
      IRCAPYBARA_LISTEN_ADDR: "0.0.0.0:6697"
      IRCAPYBARA_SERVER_NAME: "ircapybara.local"
      IRCAPYBARA_DB_PATH: "/data/ircapybara.db"
      IRCAPYBARA_TLS_ENABLED: "true"
      IRCAPYBARA_TLS_AUTOGEN: "true"
      IRCAPYBARA_TLS_CERT_FILE: "/data/tls/server.crt"
      IRCAPYBARA_TLS_KEY_FILE: "/data/tls/server.key"
      IRCAPYBARA_OPER_NAME: "admin"
      IRCAPYBARA_OPER_PASSWORD: "${IRCAPYBARA_OPER_PASSWORD:-change-me-now}"
      IRCAPYBARA_SERVER_PASSWORD: "${IRCAPYBARA_SERVER_PASSWORD:-}"
      IRCAPYBARA_CAPTCHA_ENABLED: "${IRCAPYBARA_CAPTCHA_ENABLED:-false}"
      IRCAPYBARA_IDENTIFY_TRUST_IP: "${IRCAPYBARA_IDENTIFY_TRUST_IP:-false}"
      IRCAPYBARA_INITIAL_CHANNELS: "#general|General discussion;#dev|Development"
      IRCAPYBARA_GUARD_LEVEL: "0"
      IRCAPYBARA_MAX_CLIENTS: "256"
      IRCAPYBARA_MAX_PER_IP: "8"
      IRCAPYBARA_RATE_PER_SECOND: "5"
      IRCAPYBARA_RATE_BURST: "12"
      IRCAPYBARA_TRANSFER_MAX_MB: "${IRCAPYBARA_TRANSFER_MAX_MB:-15}"
      IRCAPYBARA_MIRROR_SOURCES: "${IRCAPYBARA_MIRROR_SOURCES:-}"
      IRCAPYBARA_BRIDGE_TG_BOT_TOKEN: "${IRCAPYBARA_BRIDGE_TG_BOT_TOKEN:-}"
      IRCAPYBARA_BRIDGE_TG_MODE: "${IRCAPYBARA_BRIDGE_TG_MODE:-channel}"
      IRCAPYBARA_YTDL_ENABLED: "${IRCAPYBARA_YTDL_ENABLED:-false}"
      IRCAPYBARA_YTDL_MODE: "${IRCAPYBARA_YTDL_MODE:-channel}"
      IRCAPYBARA_YTDL_CHANNEL: "${IRCAPYBARA_YTDL_CHANNEL:-#yt-dl}"
      IRCAPYBARA_YTDL_PRIVATE: "${IRCAPYBARA_YTDL_PRIVATE:-false}"
      IRCAPYBARA_YTDL_NICK: "${IRCAPYBARA_YTDL_NICK:-yt-dl}"
      IRCAPYBARA_YTDL_FFMPEG_PATH: "/usr/local/bin/ffmpeg"
      IRCAPYBARA_YTDL_FFMPEG_PRESET: "${IRCAPYBARA_YTDL_FFMPEG_PRESET:--c:v copy -c:a copy -movflags +faststart -f mp4}"
      IRCAPYBARA_YTDL_FILENAME_TEMPLATE: "${IRCAPYBARA_YTDL_FILENAME_TEMPLATE:-}"
      IRCAPYBARA_CHAT_ENABLED: "${IRCAPYBARA_CHAT_ENABLED:-false}"
      IRCAPYBARA_CHAT_ENDPOINT: "${IRCAPYBARA_CHAT_ENDPOINT:-https://api.openai.com/v1/chat/completions}"
      IRCAPYBARA_CHAT_API_KEY: "${IRCAPYBARA_CHAT_API_KEY:-}"
      IRCAPYBARA_CHAT_MODEL: "${IRCAPYBARA_CHAT_MODEL:-}"
      IRCAPYBARA_CHAT_REASONING_EFFORT: "${IRCAPYBARA_CHAT_REASONING_EFFORT:-}"
      IRCAPYBARA_CHAT_CHANNEL: "${IRCAPYBARA_CHAT_CHANNEL:-#ai}"
      IRCAPYBARA_CHAT_PRIVATE: "${IRCAPYBARA_CHAT_PRIVATE:-false}"
      IRCAPYBARA_CHAT_HISTORY_ENABLED: "${IRCAPYBARA_CHAT_HISTORY_ENABLED:-true}"
      IRCAPYBARA_CHAT_NICK: "${IRCAPYBARA_CHAT_NICK:-chat-ai}"
      IRCAPYBARA_CHAT_SYSTEM_PROMPT: "${IRCAPYBARA_CHAT_SYSTEM_PROMPT:-}"
    volumes:
      - ircapybara-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=192m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ircapybara-debug:
    profiles: ["debug"]
    build:
      context: .
      dockerfile: Dockerfile.debug
    ports:
      - "6698:6698/tcp"
    environment:
      IRCAPYBARA_LISTEN_ADDR: "0.0.0.0:6698"
      IRCAPYBARA_SERVER_NAME: "debug.ircapybara.local"
      IRCAPYBARA_DB_PATH: "/data/ircapybara-debug.db"
      IRCAPYBARA_TLS_ENABLED: "true"
      IRCAPYBARA_TLS_AUTOGEN: "true"
      IRCAPYBARA_TLS_CERT_FILE: "/data/tls/debug.crt"
      IRCAPYBARA_TLS_KEY_FILE: "/data/tls/debug.key"
      IRCAPYBARA_OPER_NAME: "admin"
      IRCAPYBARA_OPER_PASSWORD: "${IRCAPYBARA_OPER_PASSWORD:-change-me-now}"
      IRCAPYBARA_CAPTCHA_ENABLED: "false"
      IRCAPYBARA_IDENTIFY_TRUST_IP: "${IRCAPYBARA_IDENTIFY_TRUST_IP:-false}"
      IRCAPYBARA_INITIAL_CHANNELS: "#general|General discussion;#dev|Development"
      IRCAPYBARA_GUARD_LEVEL: "0"
      IRCAPYBARA_TRANSFER_MAX_MB: "${IRCAPYBARA_TRANSFER_MAX_MB:-15}"
      IRCAPYBARA_MIRROR_SOURCES: "${IRCAPYBARA_MIRROR_SOURCES:-}"
      IRCAPYBARA_BRIDGE_TG_BOT_TOKEN: "${IRCAPYBARA_BRIDGE_TG_BOT_TOKEN:-}"
      IRCAPYBARA_BRIDGE_TG_MODE: "${IRCAPYBARA_BRIDGE_TG_MODE:-channel}"
      IRCAPYBARA_YTDL_ENABLED: "${IRCAPYBARA_YTDL_ENABLED:-false}"
      IRCAPYBARA_YTDL_MODE: "${IRCAPYBARA_YTDL_MODE:-channel}"
      IRCAPYBARA_YTDL_CHANNEL: "${IRCAPYBARA_YTDL_CHANNEL:-#yt-dl}"
      IRCAPYBARA_YTDL_PRIVATE: "${IRCAPYBARA_YTDL_PRIVATE:-false}"
      IRCAPYBARA_YTDL_NICK: "${IRCAPYBARA_YTDL_NICK:-yt-dl}"
      IRCAPYBARA_YTDL_FFMPEG_PATH: "/usr/local/bin/ffmpeg"
      IRCAPYBARA_YTDL_FFMPEG_PRESET: "${IRCAPYBARA_YTDL_FFMPEG_PRESET:--c:v copy -c:a copy -movflags +faststart -f mp4}"
      IRCAPYBARA_YTDL_FILENAME_TEMPLATE: "${IRCAPYBARA_YTDL_FILENAME_TEMPLATE:-}"
      IRCAPYBARA_CHAT_ENABLED: "${IRCAPYBARA_CHAT_ENABLED:-false}"
      IRCAPYBARA_CHAT_ENDPOINT: "${IRCAPYBARA_CHAT_ENDPOINT:-https://api.openai.com/v1/chat/completions}"
      IRCAPYBARA_CHAT_API_KEY: "${IRCAPYBARA_CHAT_API_KEY:-}"
      IRCAPYBARA_CHAT_MODEL: "${IRCAPYBARA_CHAT_MODEL:-}"
      IRCAPYBARA_CHAT_REASONING_EFFORT: "${IRCAPYBARA_CHAT_REASONING_EFFORT:-}"
      IRCAPYBARA_CHAT_CHANNEL: "${IRCAPYBARA_CHAT_CHANNEL:-#ai}"
      IRCAPYBARA_CHAT_PRIVATE: "${IRCAPYBARA_CHAT_PRIVATE:-false}"
      IRCAPYBARA_CHAT_HISTORY_ENABLED: "${IRCAPYBARA_CHAT_HISTORY_ENABLED:-true}"
      IRCAPYBARA_CHAT_NICK: "${IRCAPYBARA_CHAT_NICK:-chat-ai}"
      IRCAPYBARA_CHAT_SYSTEM_PROMPT: "${IRCAPYBARA_CHAT_SYSTEM_PROMPT:-}"
    volumes:
      - ircapybara-debug-data:/data
    tmpfs:
      - /tmp:size=192m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ircapybara-data:
  ircapybara-debug-data:
