name: Release binaries

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client:
    name: Client (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            asset: IRCapybara-client-linux-amd64.tar.gz
          - runner: windows-2025
            platform: windows/amd64
            asset: IRCapybara-client-windows-amd64.zip
          - runner: macos-15
            platform: darwin/universal
            asset: IRCapybara-client-macos-universal.tar.gz
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
          check-latest: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Test client
        run: go test ./internal/...
      - name: Install matching Wails CLI
        run: |
          module=github.com/wailsapp/wails/v2
          version=$(go list -m -f '{{.Version}}' "$module")
          go install "$module/cmd/wails@$version"
      - name: Build client
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            linux/amd64)
              wails build -platform "$PLATFORM" -s -skipbindings -trimpath -tags webkit2_41 -o IRCapybara
              ;;
            windows/amd64)
              wails build -platform "$PLATFORM" -s -skipbindings -trimpath -o IRCapybara.exe
              ;;
            darwin/universal)
              CGO_CFLAGS="-mmacosx-version-min=10.13" \
              CGO_LDFLAGS="-framework UniformTypeIdentifiers -mmacosx-version-min=10.13" \
                wails build -platform "$PLATFORM" -s -skipbindings -trimpath -o IRCapybara
              ;;
          esac
      - name: Archive Linux or macOS client
        if: runner.os != 'Windows'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          app=IRCapybara
          if [[ "$RUNNER_OS" == macOS ]]; then
            app=IRCapybara.app
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md build/bin/
          tar -czf "$ASSET" -C build/bin "$app" LICENSE THIRD_PARTY_NOTICES.md
      - name: Archive Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          Compress-Archive -LiteralPath @('build/bin/IRCapybara.exe', 'LICENSE', 'THIRD_PARTY_NOTICES.md') -DestinationPath $env:ASSET
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: client/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0

  server:
    name: Server (linux/amd64)
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
          check-latest: true
      - name: Test server
        run: go test ./...
      - name: Build and archive server
        run: |
          make build
          tar -czf IRCapybara-server-linux-amd64.tar.gz ircapybara LICENSE
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: IRCapybara-server-linux-amd64.tar.gz
          path: server/IRCapybara-server-linux-amd64.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: [client, server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: IRCapybara-*
          path: release
          merge-multiple: true
      - name: Publish assets for the tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(release/*.tar.gz release/*.zip)
          if (( ${#assets[@]} == 0 )); then
            echo "No release archives downloaded" >&2
            exit 1
          fi

          if existing=$(gh release view --json assets --jq '.assets[].name' -- "$TAG"); then
            missing=()
            for asset in "${assets[@]}"; do
              if ! grep -Fxq -- "${asset##*/}" <<< "$existing"; then
                missing+=("$asset")
              fi
            done
            if (( ${#missing[@]} > 0 )); then
              gh release upload -- "$TAG" "${missing[@]}"
            fi
          else
            gh release create --verify-tag --generate-notes -- "$TAG" "${assets[@]}"
          fi
