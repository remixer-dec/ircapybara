name: Release binaries

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client:
    name: Client (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            asset: IRCapybara-client-linux-amd64.tar.gz
          - runner: windows-2025
            platform: windows/amd64
            asset: IRCapybara-client-windows-amd64.zip
          - runner: macos-15
            platform: darwin/universal
            asset: IRCapybara-client-macos-universal.tar.gz
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
          check-latest: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Test client
        run: go test ./internal/...
      - name: Install matching Wails CLI
        run: |
          module=github.com/wailsapp/wails/v2
          version=$(go list -m -f '{{.Version}}' "$module")
          go install "$module/cmd/wails@$version"
      - name: Build client
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            linux/amd64)
              wails build -platform "$PLATFORM" -s -skipbindings -trimpath -tags webkit2_41 -o IRCapybara
              ;;
            windows/amd64)
              wails build -platform "$PLATFORM" -s -skipbindings -trimpath -o IRCapybara.exe
              ;;
            darwin/universal)
              CGO_CFLAGS="-mmacosx-version-min=10.13" \
              CGO_LDFLAGS="-framework UniformTypeIdentifiers -mmacosx-version-min=10.13" \
                wails build -platform "$PLATFORM" -s -skipbindings -trimpath -o IRCapybara
              ;;
          esac
      - name: Archive Linux or macOS client
        if: runner.os != 'Windows'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          app=IRCapybara
          if [[ "$RUNNER_OS" == macOS ]]; then
            app=IRCapybara.app
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md build/bin/
          tar -czf "$ASSET" -C build/bin "$app" LICENSE THIRD_PARTY_NOTICES.md
      - name: Archive Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          Compress-Archive -LiteralPath @('build/bin/IRCapybara.exe', 'LICENSE', 'THIRD_PARTY_NOTICES.md') -DestinationPath $env:ASSET
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: client/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0

  android:
    name: Client (Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: client/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Build release APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          # Use the runner's NDK r29 for 16 KiB native library alignment.
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          ./build-core.sh
          gradle --no-daemon :app:assembleRelease
      - name: Prepare release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          if [[ -z "$ANDROID_KEYSTORE_BASE64$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD" ]]; then
            echo '::warning::Android signing secrets are unset. Publishing an unsigned release APK.'
            mv "$unsigned" IRCapybara-client-android-unsigned.apk
            exit 0
          fi

          : "${ANDROID_KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Set the ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Set the ANDROID_KEY_ALIAS secret}"
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          signing_dir=$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          base64 --decode <<< "$ANDROID_KEYSTORE_BASE64" > "$signing_dir/release.keystore"
          "$build_tools/zipalign" -P 16 4 "$unsigned" "$signing_dir/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$signing_dir/release.keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out IRCapybara-client-android.apk "$signing_dir/aligned.apk"
          "$build_tools/apksigner" verify IRCapybara-client-android.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: IRCapybara-client-android
          path: client/android/IRCapybara-client-android*.apk
          if-no-files-found: error
          compression-level: 0

  server:
    name: Server (linux/amd64)
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
          check-latest: true
      - name: Test server
        run: go test ./...
      - name: Build and archive server
        run: |
          make build
          tar -czf IRCapybara-server-linux-amd64.tar.gz ircapybara LICENSE
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: IRCapybara-server-linux-amd64.tar.gz
          path: server/IRCapybara-server-linux-amd64.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: [client, android, server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: IRCapybara-*
          path: release
          merge-multiple: true
      - name: Publish assets for the tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          apk=(release/IRCapybara-client-android*.apk)
          if (( ${#apk[@]} != 1 )); then
            echo "Expected one Android release APK" >&2
            exit 1
          fi
          assets=(release/*.tar.gz release/*.zip "${apk[@]}")

          if existing=$(gh release view --json assets --jq '.assets[].name' -- "$TAG"); then
            missing=()
            for asset in "${assets[@]}"; do
              if ! grep -Fxq -- "${asset##*/}" <<< "$existing"; then
                missing+=("$asset")
              fi
            done
            if (( ${#missing[@]} > 0 )); then
              gh release upload -- "$TAG" "${missing[@]}"
            fi
          else
            gh release create --verify-tag --generate-notes -- "$TAG" "${assets[@]}"
          fi
