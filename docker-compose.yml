services:
  ircapybara:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "6697:6697/tcp"
    environment:
      IRCAPYBARA_LISTEN_ADDR: "0.0.0.0:6697"
      IRCAPYBARA_SERVER_NAME: "ircapybara.local"
      IRCAPYBARA_DB_PATH: "/data/ircapybara.db"
      IRCAPYBARA_TLS_ENABLED: "true"
      IRCAPYBARA_TLS_AUTOGEN: "true"
      IRCAPYBARA_TLS_CERT_FILE: "/data/tls/server.crt"
      IRCAPYBARA_TLS_KEY_FILE: "/data/tls/server.key"
      IRCAPYBARA_OPER_NAME: "admin"
      IRCAPYBARA_OPER_PASSWORD: "${IRCAPYBARA_OPER_PASSWORD:-change-me-now}"
      IRCAPYBARA_SERVER_PASSWORD: "${IRCAPYBARA_SERVER_PASSWORD:-}"
      IRCAPYBARA_CAPTCHA_ENABLED: "${IRCAPYBARA_CAPTCHA_ENABLED:-false}"
      IRCAPYBARA_INITIAL_CHANNELS: "#general|General discussion;#dev|Development"
      IRCAPYBARA_GUARD_LEVEL: "0"
      IRCAPYBARA_MAX_CLIENTS: "256"
      IRCAPYBARA_MAX_PER_IP: "8"
      IRCAPYBARA_RATE_PER_SECOND: "5"
      IRCAPYBARA_RATE_BURST: "12"
    volumes:
      - ircapybara-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ircapybara-debug:
    profiles: ["debug"]
    build:
      context: .
      dockerfile: Dockerfile.debug
    ports:
      - "6698:6698/tcp"
    environment:
      IRCAPYBARA_LISTEN_ADDR: "0.0.0.0:6698"
      IRCAPYBARA_SERVER_NAME: "debug.ircapybara.local"
      IRCAPYBARA_DB_PATH: "/data/ircapybara-debug.db"
      IRCAPYBARA_TLS_ENABLED: "true"
      IRCAPYBARA_TLS_AUTOGEN: "true"
      IRCAPYBARA_TLS_CERT_FILE: "/data/tls/debug.crt"
      IRCAPYBARA_TLS_KEY_FILE: "/data/tls/debug.key"
      IRCAPYBARA_OPER_NAME: "admin"
      IRCAPYBARA_OPER_PASSWORD: "${IRCAPYBARA_OPER_PASSWORD:-change-me-now}"
      IRCAPYBARA_CAPTCHA_ENABLED: "false"
      IRCAPYBARA_INITIAL_CHANNELS: "#general|General discussion;#dev|Development"
      IRCAPYBARA_GUARD_LEVEL: "0"
    volumes:
      - ircapybara-debug-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ircapybara-data:
  ircapybara-debug-data:
